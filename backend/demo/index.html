<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拾獲物招領</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/demo.js" defer></script>
</head>
<body>
<header>
  <nav aria-label="主選單">
    <a class="brand" href="/">拾獲物招領</a>
    <a href="/">民眾查詢</a>
    <a href="/staff">機構後台</a>
  </nav>
</header>
<main>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <section id="public" hidden>
    <h1>查詢拾獲物</h1>
    <form id="search" class="panel">
      <div class="fields">
        <label>名稱或物品編號<input name="keyword" maxlength="120"></label>
        <label>類別<input name="category" maxlength="80"></label>
        <label>拾獲地點<input name="location" maxlength="240"></label>
        <label>保管機構<select name="organization"><option value="0">所有機構</option></select></label>
        <label>拾獲日期起<input type="date" name="since"></label>
        <label>拾獲日期迄<input type="date" name="until"></label>
        <label class="wide">查詢照片<input name="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
      </div>
      <div class="actions">
        <button value="text">查詢拾獲物</button>
        <button value="photo" class="secondary">用照片搜尋</button>
      </div>
    </form>
    <h2 id="results-title">待認領物品</h2>
    <div id="results" class="cards"></div>
    <div id="public-pages" class="actions"></div>
  </section>
  <section id="staff" hidden>
    <h1>機構後台</h1>
    <form id="login" class="panel">
      <div class="fields">
        <label>承辦人帳號<input name="username" autocomplete="username" required></label>
        <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      </div>
      <button>登入</button>
    </form>
    <div id="workspace" hidden>
      <div class="actions"><strong id="identity"></strong><button id="logout" class="secondary">登出</button></div>
      <details class="panel">
        <summary>機構資料與密碼</summary>
        <form id="organization" class="fields">
          <label>機構名稱<input name="name" required maxlength="120"></label>
          <label>對外地址<input name="address" required maxlength="240"></label>
          <label>對外電話<input name="phone" required maxlength="50"></label>
          <div><button>儲存機構資料</button></div>
        </form>
        <form id="password" class="fields">
          <label>原密碼<input name="current_password" type="password" autocomplete="current-password" required></label>
          <label>新密碼<input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label>
          <div><button>修改密碼</button></div>
        </form>
      </details>
      <form id="item-form" class="panel">
        <h2 id="form-title">建立拾獲物</h2>
        <div class="fields">
          <label>物品名稱<input name="name" required maxlength="120"></label>
          <label>類別<input name="category" required maxlength="80"></label>
          <label>拾獲日期<input name="found_date" type="date" required></label>
          <label>拾獲地點<input name="found_location" required maxlength="240"></label>
          <label class="wide">內部核對備註<textarea name="private_note" maxlength="2000"></textarea></label>
          <label class="wide">上傳照片（每張最多 8 MB）<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
        </div>
        <div class="actions"><button>儲存物品</button><button type="button" id="new-item" class="secondary">新增另一件</button></div>
      </form>
      <div id="item-detail"></div>
      <h2>本機構拾獲物</h2>
      <div id="staff-results" class="cards"></div>
      <div id="staff-pages" class="actions"></div>
    </div>
  </section>
</main>
<dialog id="details"><button id="close-details" class="secondary">關閉</button><div id="detail"></div></dialog>
</body>
</html>
